<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍓 Древнерусская Летняя Сказка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #f4e4bc;
        }
        .header {
            width: 100%; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.3); border-bottom: 2px solid #8b5a2b;
        }
        .header h1 { font-size: 18px; color: #ffd700; }
        .header-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 5px 10px; }
        .screen { display: none; flex-direction: column; align-items: center; padding: 20px; width: 100%; max-width: 400px; }
        .screen.active { display: flex; }
        .title { font-size: 28px; color: #ffd700; text-align: center; margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: #d4c4a8; text-align: center; margin-bottom: 30px; }
        .btn {
            background: linear-gradient(180deg, #8b5a2b 0%, #5c3d1e 100%);
            border: 3px solid #ffd700; border-radius: 15px;
            padding: 15px 40px; font-size: 18px; color: #ffd700;
            cursor: pointer; margin: 10px 0; width: 100%; max-width: 280px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn:hover { background: linear-gradient(180deg, #a67030 0%, #7a5030 100%); }
        .btn-secondary { background: linear-gradient(180deg, #4a3728 0%, #2d1f15 100%); border-color: #c9a959; font-size: 14px; padding: 10px 20px; }
        .levels-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; width: 100%; }
        .level-btn {
            aspect-ratio: 1; background: linear-gradient(180deg, #5c3d1e 0%, #3d2810 100%);
            border: 2px solid #8b5a2b; border-radius: 10px; font-size: 16px;
            color: #ffd700; cursor: pointer;
        }
        .level-btn:hover:not(:disabled) { background: linear-gradient(180deg, #7a5030 0%, #5c3d1e 100%); border-color: #ffd700; }
        .level-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .level-btn.completed { background: linear-gradient(180deg, #2d5a27 0%, #1a3d15 100%); border-color: #4a9c3d; }
        .settings-group { width: 100%; margin: 15px 0; }
        .settings-label { font-size: 14px; color: #c9a959; margin-bottom: 8px; display: block; }
        .settings-row { display: flex; gap: 10px; }
        .setting-btn {
            flex: 1; padding: 12px; background: linear-gradient(180deg, #3d2810 0%, #2d1f15 100%);
            border: 2px solid #5c3d1e; border-radius: 10px; color: #d4c4a8; font-size: 14px; cursor: pointer;
        }
        .setting-btn.active { background: linear-gradient(180deg, #5c3d1e 0%, #3d2810 100%); border-color: #ffd700; color: #ffd700; }
        #gameCanvas { border: 4px solid #8b5a2b; border-radius: 10px; box-shadow: 0 0 20px rgba(139, 90, 43, 0.5); touch-action: none; }
        .game-info { display: flex; justify-content: space-between; width: 100%; max-width: 360px; margin: 15px 0; padding: 10px 15px; background: rgba(0,0,0,0.3); border-radius: 10px; border: 2px solid #5c3d1e; }
        .game-info-item { text-align: center; }
        .game-info-value { font-size: 20px; color: #ffd700; font-weight: bold; }
        .game-info-label { font-size: 11px; color: #c9a959; }
        .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .popup.active { display: flex; }
        .popup-content {
            background: linear-gradient(180deg, #2d1b4e 0%, #1a0a2e 100%); border: 4px solid #ffd700;
            border-radius: 20px; padding: 30px; text-align: center; max-width: 300px;
        }
        .popup-title { font-size: 24px; color: #ffd700; margin-bottom: 15px; }
        .popup-text { font-size: 14px; color: #d4c4a8; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <button class="header-btn" id="backBtn" style="display:none;">⬅️</button>
        <h1>🍓 Летняя Сказка</h1>
        <button class="header-btn" id="menuBtn">⚙️</button>
    </div>

    <div class="screen active" id="mainMenu">
        <div style="font-size: 60px; margin: 20px 0;">🏛️</div>
        <div class="title">Древнерусская<br>Летняя Сказка</div>
        <div class="subtitle">Собирай ягоды и грибы в три ряда!</div>
        <button class="btn" id="playBtn">🍓 Играть</button>
        <button class="btn btn-secondary" id="continueBtn" style="display:none;">Продолжить</button>
        <button class="btn btn-secondary" id="settingsBtn">⚙️ Настройки</button>
    </div>

    <div class="screen" id="levelSelect">
        <div class="title">Выбор Уровня</div>
        <div class="levels-grid" id="levelsGrid"></div>
        <button class="btn btn-secondary" id="backToMenu">⬅️ Назад</button>
    </div>

    <div class="screen" id="settingsScreen">
        <div class="title">⚙️ Настройки</div>
        <div class="settings-group">
            <label class="settings-label">🖼️ Качество</label>
            <div class="settings-row">
                <button class="setting-btn active" data-setting="quality" data-value="high">Высокое</button>
                <button class="setting-btn" data-setting="quality" data-value="low">Низкое</button>
            </div>
        </div>
        <button class="btn btn-secondary" id="settingsBack">⬅️ Назад</button>
    </div>

    <div class="screen" id="gameScreen">
        <div class="game-info">
            <div class="game-info-item"><div class="game-info-value" id="levelDisplay">1</div><div class="game-info-label">Уровень</div></div>
            <div class="game-info-item"><div class="game-info-value" id="scoreDisplay">0</div><div class="game-info-label">Очки</div></div>
            <div class="game-info-item"><div class="game-info-value" id="movesDisplay">20</div><div class="game-info-label">Ходы</div></div>
        </div>
        <canvas id="gameCanvas" width="360" height="360"></canvas>
        <div style="font-size: 12px; color: #c9a959; margin-top: 10px;" id="targetDisplay">Цель: 300 очков</div>
    </div>

    <div class="popup" id="winPopup">
        <div class="popup-content">
            <div style="font-size: 50px;">🎉</div>
            <div class="popup-title">Победа!</div>
            <div class="popup-text" id="winText">Ты прошёл уровень!</div>
            <button class="btn" id="nextLevelBtn">Следующий уровень →</button>
            <button class="btn btn-secondary" id="winMenuBtn">В меню</button>
        </div>
    </div>

    <div class="popup" id="losePopup">
        <div class="popup-content">
            <div style="font-size: 50px;">😢</div>
            <div class="popup-title">Не хватило!</div>
            <div class="popup-text">Попробуй ещё раз</div>
            <button class="btn" id="retryBtn">🔄 Заново</button>
            <button class="btn btn-secondary" id="loseMenuBtn">В меню</button>
        </div>
    </div>

<script>
// ========== ИГРОВАЯ ЛОГИКА ==========

const ICONS = {
    BERRY: '🍓', MUSHROOM: '🍄', FLOWER: '🌸', MATRYOSHKA: '🪆',
    BALALAIKA: '🎸', KARAWAY: '🍞', BEAR: '🐻', FOX: '🦊'
};
const ICON_TYPES = Object.keys(ICONS);

// Уровни
const LEVELS = [
    { id: 1, cols: 6, rows: 6, moves: 25, target: 300, name: 'Луг' },
    { id: 2, cols: 6, rows: 6, moves: 24, target: 400, name: 'Опушка' },
    { id: 3, cols: 7, rows: 6, moves: 23, target: 500, name: 'Лес' },
    { id: 4, cols: 7, rows: 7, moves: 22, target: 600, name: 'Тропинка' },
    { id: 5, cols: 7, rows: 7, moves: 21, target: 750, name: 'Ручей' },
    { id: 6, cols: 7, rows: 7, moves: 20, target: 900, name: 'Мост' },
    { id: 7, cols: 8, rows: 7, moves: 20, target: 1050, name: 'Поляна' },
    { id: 8, cols: 8, rows: 7, moves: 19, target: 1200, name: 'Цветник' },
    { id: 9, cols: 8, rows: 8, moves: 18, target: 1400, name: 'Ягодник' },
    { id: 10, cols: 8, rows: 8, moves: 18, target: 1600, name: 'Грибное место' },
    { id: 11, cols: 8, rows: 8, moves: 17, target: 1850, name: 'Древний дуб' },
    { id: 12, cols: 9, rows: 8, moves: 17, target: 2100, name: 'Берёзовая роща' },
    { id: 13, cols: 9, rows: 8, moves: 16, target: 2400, name: 'Кедровый бор' },
    { id: 14, cols: 9, rows: 9, moves: 15, target: 2750, name: 'Верхушка горы' },
    { id: 15, cols: 9, rows: 9, moves: 15, target: 3000, name: 'Царство Лесовика' }
];

// Состояние игры
let game = {
    level: null,
    board: null,
    score: 0,
    movesLeft: 0,
    target: 0,
    selected: null,
    isPlaying: true,
    canvasCtx: null,
    cellSize: 40,
    boardOffset: { x: 0, y: 0 }
};

// ========== RENDERER ==========
const Renderer = {
    ctx: null,
    cellSize: 40,
    boardOffset: { x: 0, y: 0 },
    
    init() {
        const canvas = document.getElementById('gameCanvas');
        this.ctx = canvas.getContext('2d');
    },
    
    setBoardSize(cols, rows, canvasSize) {
        this.cellSize = Math.floor(canvasSize / Math.max(cols, rows));
        this.boardOffset = {
            x: (canvasSize - this.cellSize * cols) / 2,
            y: (canvasSize - this.cellSize * rows) / 2
        };
    },
    
    clear() {
        this.ctx.fillStyle = '#1a0a2e';
        this.ctx.fillRect(0, 0, 360, 360);
    },
    
    drawBoard() {
        this.clear();
        
        // Фон доски
        const cols = game.level.cols;
        const rows = game.level.rows;
        this.ctx.fillStyle = 'rgba(45, 27, 78, 0.8)';
        this.ctx.strokeStyle = '#8b5a2b';
        this.ctx.lineWidth = 3;
        
        const boardWidth = this.cellSize * cols;
        const boardHeight = this.cellSize * rows;
        this.ctx.beginPath();
        this.ctx.roundRect(this.boardOffset.x - 5, this.boardOffset.y - 5, boardWidth + 10, boardHeight + 10, 10);
        this.ctx.fill();
        this.ctx.stroke();
        
        // Клетки
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (game.board[r][c]) {
                    this.drawCell(game.board[r][c], r, c);
                }
            }
        }
    },
    
    drawCell(type, row, col) {
        const x = this.boardOffset.x + col * this.cellSize;
        const y = this.boardOffset.y + row * this.cellSize;
        const size = this.cellSize;
        const padding = 2;
        
        // Фон клетки
        this.ctx.fillStyle = 'rgba(92, 61, 30, 0.6)';
        this.ctx.beginPath();
        this.ctx.roundRect(x + padding, y + padding, size - padding * 2, size - padding * 2, 6);
        this.ctx.fill();
        
        // Рамка
        this.ctx.strokeStyle = '#5c3d1e';
        this.ctx.lineWidth = 1;
        this.ctx.stroke();
        
        // Иконка
        const emoji = ICONS[type] || '🍓';
        const fontSize = size * 0.65;
        this.ctx.font = `${fontSize}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText(emoji, x + size / 2, y + size / 2);
    },
    
    drawSelection(row, col) {
        const x = this.boardOffset.x + col * this.cellSize;
        const y = this.boardOffset.y + row * this.cellSize;
        const size = this.cellSize;
        const padding = 2;
        
        this.ctx.strokeStyle = '#ffd700';
        this.ctx.lineWidth = 3;
        this.ctx.setLineDash([5, 3]);
        
        this.ctx.beginPath();
        this.ctx.roundRect(x + padding, y + padding, size - padding * 2, size - padding * 2, 6);
        this.ctx.stroke();
        
        this.ctx.setLineDash([]);
    }
};

// ========== GAME LOGIC ==========
function randomIcon() {
    return ICON_TYPES[Math.floor(Math.random() * ICON_TYPES.length)];
}

function createBoard(cols, rows) {
    const board = [];
    for (let r = 0; r < rows; r++) {
        board[r] = [];
        for (let c = 0; c < cols; c++) {
            board[r][c] = randomIcon();
        }
    }
    // Убираем начальные матчи
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols - 2; c++) {
            if (board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
                board[r][c+2] = randomIcon();
            }
        }
    }
    for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows - 2; r++) {
            if (board[r][c] === board[r+1][c] && board[r][c] === board[r+2][c]) {
                board[r+2][c] = randomIcon();
            }
        }
    }
    return board;
}

function findMatches() {
    const matches = [];
    const rows = game.level.rows;
    const cols = game.level.cols;
    
    // Горизонтальные
    for (let r = 0; r < rows; r++) {
        let start = 0;
        for (let c = 1; c <= cols; c++) {
            if (c < cols && game.board[r][c] === game.board[r][start]) {
                continue;
            }
            if (c - start >= 3) {
                const cells = [];
                for (let i = start; i < c; i++) cells.push({ row: r, col: i });
                matches.push({ cells, length: c - start });
            }
            start = c;
        }
    }
    
    // Вертикальные
    for (let c = 0; c < cols; c++) {
        let start = 0;
        for (let r = 1; r <= rows; r++) {
            if (r < rows && game.board[r][c] === game.board[start][c]) {
                continue;
            }
            if (r - start >= 3) {
                const cells = [];
                for (let i = start; i < r; i++) cells.push({ row: i, col: c });
                matches.push({ cells, length: r - start });
            }
            start = r;
        }
    }
    
    return matches;
}

function removeMatches(matches) {
    const toRemove = [];
    for (const match of matches) {
        for (const cell of match.cells) {
            toRemove.push(`${cell.row},${cell.col}`);
        }
    }
    const unique = [...new Set(toRemove)];
    game.score += unique.length * 10;
    for (const key of unique) {
        const [r, c] = key.split(',').map(Number);
        game.board[r][c] = null;
    }
    return unique.length;
}

function dropAndFill() {
    const rows = game.level.rows;
    const cols = game.level.cols;
    
    for (let c = 0; c < cols; c++) {
        const cells = [];
        for (let r = rows - 1; r >= 0; r--) {
            if (game.board[r][c] !== null) {
                cells.push(game.board[r][c]);
            }
        }
        const fillCount = rows - cells.length;
        for (let i = 0; i < fillCount; i++) {
            cells.push(randomIcon());
        }
        for (let r = rows - 1; r >= 0; r--) {
            game.board[r][c] = cells[rows - 1 - r];
        }
    }
}

async function processMatches() {
    let matches = findMatches();
    while (matches.length > 0) {
        removeMatches(matches);
        Renderer.drawBoard();
        await delay(200);
        dropAndFill();
        Renderer.drawBoard();
        await delay(200);
        matches = findMatches();
    }
}

function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function tryMove(r1, c1, r2, c2) {
    game.selected = null;
    game.isPlaying = false;
    
    // Меняем местами
    const temp = game.board[r1][c1];
    game.board[r1][c1] = game.board[r2][c2];
    game.board[r2][c2] = temp;
    
    Renderer.drawBoard();
    await delay(150);
    
    const matches = findMatches();
    
    if (matches.length === 0) {
        // Возвращаем обратно
        game.board[r2][c2] = game.board[r1][c1];
        game.board[r1][c1] = temp;
        Renderer.drawBoard();
        game.isPlaying = true;
        return;
    }
    
    game.movesLeft--;
    updateUI();
    
    await processMatches();
    updateUI();
    
    // Проверяем конец игры
    if (game.score >= game.target) {
        document.getElementById('winText').textContent = `Очки: ${game.score}`;
        document.getElementById('winPopup').classList.add('active');
    } else if (game.movesLeft <= 0) {
        document.getElementById('losePopup').classList.add('active');
    } else {
        game.isPlaying = true;
    }
}

function updateUI() {
    document.getElementById('levelDisplay').textContent = game.level.id;
    document.getElementById('scoreDisplay').textContent = game.score;
    document.getElementById('movesDisplay').textContent = game.movesLeft;
    document.getElementById('targetDisplay').textContent = `Цель: ${game.target} очков`;
}

function startLevel(levelId) {
    game.level = LEVELS.find(l => l.id === levelId) || LEVELS[0];
    game.score = 0;
    game.movesLeft = game.level.moves;
    game.target = game.level.target;
    game.selected = null;
    game.isPlaying = true;
    
    const canvas = document.getElementById('gameCanvas');
    const size = 360;
    canvas.width = size;
    canvas.height = size;
    
    Renderer.setBoardSize(game.level.cols, game.level.rows, size);
    game.board = createBoard(game.level.cols, game.level.rows);
    Renderer.drawBoard();
    updateUI();
    
    showScreen('gameScreen');
}

// ========== UI ==========
function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    
    const backBtn = document.getElementById('backBtn');
    backBtn.style.display = (screenId === 'mainMenu') ? 'none' : 'block';
    
    const title = document.querySelector('.header h1');
    if (screenId === 'levelSelect') title.textContent = '🍓 Выбор Уровня';
    else if (screenId === 'settingsScreen') title.textContent = '⚙️ Настройки';
    else if (screenId === 'gameScreen') title.textContent = `🍓 Уровень ${game.level ? game.level.id : 1}`;
    else title.textContent = '🍓 Летняя Сказка';
}

function renderLevels() {
    const grid = document.getElementById('levelsGrid');
    grid.innerHTML = '';
    
    const saved = localStorage.getItem('match3_progress');
    const completed = saved ? JSON.parse(saved).completedLevels : [];
    
    for (let i = 1; i <= 15; i++) {
        const btn = document.createElement('button');
        btn.className = 'level-btn';
        btn.textContent = i;
        
        if (completed.includes(i)) {
            btn.classList.add('completed');
        }
        
        if (i === 1 || completed.includes(i - 1)) {
            btn.disabled = false;
        } else {
            btn.disabled = true;
        }
        
        btn.addEventListener('click', () => {
            if (!btn.disabled) startLevel(i);
        });
        
        grid.appendChild(btn);
    }
}

function initUI() {
    document.getElementById('playBtn').addEventListener('click', () => {
        renderLevels();
        showScreen('levelSelect');
    });
    
    document.getElementById('settingsBtn').addEventListener('click', () => {
        showScreen('settingsScreen');
    });
    
    document.getElementById('settingsBack').addEventListener('click', () => {
        showScreen('mainMenu');
    });
    
    document.getElementById('backToMenu').addEventListener('click', () => {
        showScreen('mainMenu');
    });
    
    document.getElementById('menuBtn').addEventListener('click', () => {
        showScreen('settingsScreen');
    });
    
    document.getElementById('backBtn').addEventListener('click', () => {
        if (game.isPlaying === false && game.level) {
            if (confirm('Вернуться в меню?')) {
                showScreen('mainMenu');
            }
        } else {
            showScreen('mainMenu');
        }
    });
    
    document.getElementById('nextLevelBtn').addEventListener('click', () => {
        document.getElementById('winPopup').classList.remove('active');
        const nextLevel = game.level.id + 1;
        if (nextLevel <= 15) startLevel(nextLevel);
        else showScreen('mainMenu');
    });
    
    document.getElementById('winMenuBtn').addEventListener('click', () => {
        document.getElementById('winPopup').classList.remove('active');
        showScreen('mainMenu');
    });
    
    document.getElementById('retryBtn').addEventListener('click', () => {
        document.getElementById('losePopup').classList.remove('active');
        startLevel(game.level.id);
    });
    
    document.getElementById('loseMenuBtn').addEventListener('click', () => {
        document.getElementById('losePopup').classList.remove('active');
        showScreen('mainMenu');
    });
    
    // Settings buttons
    document.querySelectorAll('[data-setting]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll(`[data-setting="${btn.dataset.setting}"]`).forEach(b => {
                b.classList.toggle('active', b === btn);
            });
        });
    });
    
    // Canvas click
    document.getElementById('gameCanvas').addEventListener('click', (e) => {
        if (!game.isPlaying || !game.level) return;
        
        const rect = e.target.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const col = Math.floor((x - Renderer.boardOffset.x) / Renderer.cellSize);
        const row = Math.floor((y - Renderer.boardOffset.y) / Renderer.cellSize);
        
        if (row < 0 || row >= game.level.rows || col < 0 || col >= game.level.cols) return;
        
        if (!game.selected) {
            game.selected = { row, col };
            Renderer.drawBoard();
            Renderer.drawSelection(row, col);
        } else {
            const dr = Math.abs(row - game.selected.row);
            const dc = Math.abs(col - game.selected.col);
            
            if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
                tryMove(game.selected.row, game.selected.col, row, col);
            } else if (row === game.selected.row && col === game.selected.col) {
                game.selected = null;
                Renderer.drawBoard();
            } else {
                game.selected = { row, col };
                Renderer.drawBoard();
                Renderer.drawSelection(row, col);
            }
        }
    });
}

// Init
document.addEventListener('DOMContentLoaded', () => {
    Renderer.init();
    initUI();
    showScreen('mainMenu');
});
